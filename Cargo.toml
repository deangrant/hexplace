[workspace]
resolver = "2"
members = [
    "crates/hexplace-core",
    "crates/hexplace-engine",
    "crates/hexplace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
hexplace-core = { path = "crates/hexplace-core" }
hexplace-engine = { path = "crates/hexplace-engine" }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
fs4 = { version = "0.12", features = ["sync"] }
h3o = "0.8"
memmap2 = "0.9"
osmpbf = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.22"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
